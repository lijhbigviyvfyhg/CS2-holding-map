echo "[autopeek_training] cleaning training binds and restoring common CS2 defaults"

alias "+autopeek_use" ""
alias "-autopeek_use" ""
alias "autopeek_rebind_cfg" "exec autopeek_training_binds"

bind "e" "+use"
bind "y" "messagemode"
bind "u" "messagemode2"
bind "0" "slot10"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"

unbind "v"
unbind "o"
unbind "p"
unbind "m"
unbind "i"
unbind "j"
unbind "k"
unbind "l"
unbind "n"
unbind "["
unbind "]"
unbind "-"
unbind "="
unbind ","
unbind "."
unbind "/"
unbind "BACKSPACE"
unbind "MOUSE4"
unbind "MOUSE5"
unbind "scancode49"

host_writeconfig
echo "[autopeek_training] recover_cfg done; run autopeek_rebind_cfg to enable training binds again"
